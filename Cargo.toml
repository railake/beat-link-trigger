[workspace]
resolver = "2"
members = ["crates/beat-link", "crates/beat-link-trigger"]

[workspace.package]
version = "9.0.0-alpha.1"
edition = "2021"
license = "EPL-2.0"
repository = "https://github.com/Deep-Symmetry/beat-link-trigger"
rust-version = "1.80"

[workspace.dependencies]
beat-link = { path = "crates/beat-link" }
crossbeam-channel = "0.5"
log = { version = "0.4", features = ["std"] }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 4
